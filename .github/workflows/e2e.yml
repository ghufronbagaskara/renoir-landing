name: E2E

# Validation shown on every pull request and on pushes to main or v* work branches:
# unit tests, types, build guards, every built-site Chrome check (desktop and phone)
# and the Worker end-to-end test (local workerd + D1, no Cloudflare credentials).
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, "v[0-9]*"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Type check
        run: bun run check
      - name: Build and guard links, copy and SEO
        run: bun run build && bun run check:links && bun run check:copy && bun run check:seo
      # ubuntu-latest ships Google Chrome; the checks launch it with channel "chrome".
      - name: Browser checks and Worker end-to-end test
        run: bun run test:browser
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .work-capture/
          if-no-files-found: ignore
          retention-days: 7
